name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the notes can diff against the last tag

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # cd into dist first so index.html sits at the archive root.
      - name: Zip dist
        run: |
          cd dist
          zip -r "../${{ github.event.repository.name }}-${{ github.ref_name }}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.event.repository.name }}-${{ github.ref_name }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
